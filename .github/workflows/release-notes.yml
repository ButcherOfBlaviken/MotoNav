name: Update release documentation
on:
  push:
    branches: [main]
    paths:
      - docs/RELEASE-IOS-*.md
      - .github/workflows/release-notes.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Update existing release description
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(cat RELEASE_VERSION)
          TAG="ios-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "docs/RELEASE-IOS-${VERSION}.md"
          fi
